<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css" />
    <title>Past Paper</title>
    <style>
        .card-header {
            background-color: #2F9A6E;
            color: white;
        }

        label {
            font-weight: bold;
        }

        option {
            background-color: #FF9E06;
            color: aliceblue;
        }
    </style>
</head>

<body>
    <div class="container" style="margin: auto;">
        <div class="row ">
            <div class="col-12">
                <div class="card ">
                    <div class="card-header">
                        <h2>Past Paper</h2>
                    </div>
                    <div class="card-body" style="padding: 20px;">
                        <form action="">
                            <div class="mb-3">
                                <div class="row">
                                    <label for="class" class="form-label">Institute</label>
                                    <div class="col-8 ">
                                        <select class="form-select" aria-label="Default select example" id="class">
                                            <option selected>Open this select menu</option>
                                            <option value="9th">9th</option>
                                            <option value="10th">10th</option>
                                            <option value="11th">11th</option>
                                        </select>
                                    </div>
                                    <div class="col-2">
                                        <button class="btn btn-info">Button</button>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <div class="row">
                                    <label for="class" class="form-label">Paper Title</label>
                                    <div class="col-8">
                                        <select class="form-select" aria-label="Default select example" id="class">
                                            <option selected>Open this select menu</option>
                                            <option value="pak_study">Pakistan Study</option>
                                            <option value="computer">Computer Sceince</option>
                                            <option value="Islamic">Islamiyat</option>
                                        </select>
                                    </div>
                                    <div class="col-2">
                                        <button class="btn btn-info">Button</button>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <div class="row">

                                    <label for="class" class="form-label">No. of Question</label>
                                    <div class="col-12">
                                        <input type="text" class="form-control" id="topic" placeholder="100">
                                    </div>

                                </div>
                            </div>
                            <div class="mb-3">


                                <div class="row">
                                    <label for="class" class="form-label">Add Description</label>
                                    <div class="col-8">
                                        <input type="file" class="form-control" id="topic" placeholder="Add Topic">
                                    </div>
                                    <div class="col-2 ">
                                        <button class="btn btn-info">Button</button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-floating mb-3">
                                <textarea type="text" class="form-control" id="floatingInput"
                                    placeholder="Add question here..." rows="2"></textarea>
                                <label for="floatingInput">Question</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="option_a" placeholder="option a">
                                <label for="option_a">(a)</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="option_b" placeholder="option b">
                                <label for="option_b">(b)</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="option_c" placeholder="option c">
                                <label for="option_c">(c)</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="option_d" placeholder="option d">
                                <label for="option_d">(d)</label>
                            </div>
                            <div class="col-12 mb-3">
                                <button type="submit" class="btn btn-primary ">Add</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>

</body>

</html>
